name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No install step on purpose. The logic these tests cover - lyrics
      # parsing, the word-timing invariants, word-to-line mapping, the export
      # formats and the missing-line thresholds - is pure stdlib. Pulling in
      # torch and demucs to run it would cost minutes and test nothing extra.
      - name: Run tests
        run: python -m unittest discover -s tests -v
