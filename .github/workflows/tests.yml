name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No install step on purpose. The logic these tests cover - lyrics
      # parsing, the word-timing invariants, word-to-line mapping, the export
      # formats and the missing-line thresholds - is pure stdlib. Pulling in
      # torch and demucs to run it would cost minutes and test nothing extra.
      - name: Run tests
        run: python -m unittest discover -s tests -v

  visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The player's and the studio's arithmetic (lyrics.js, timeline.js) is checked
      # against the Python it mirrors by running it in node.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Only what the tests marked "not local" import, at the pins visuals/.venv has:
      # no torch, no transformers, no weights. Pillow sets the burned-in words. moderngl is
      # imported, never given a context; the tests that draw are marked local.
      - name: Install
        run: |
          grep -E '^(numpy|scipy|soundfile|moderngl|Pillow|pytest)==' visuals/requirements.txt \
            | xargs python -m pip install
      - name: Run tests
        run: PYTHONPATH=. python -m pytest -o addopts="" -p no:warnings --strict-markers -m "not local" visuals/tests
