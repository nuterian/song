  <script type="module">
    // The page's own controls, over the player's (window.player): the songs, play and the
    // time, the three cameras, the words, what was heard, the full screen.
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const body = document.body, stage = $("stage"), gl = $("gl");
    const audio = $("audio"), big = $("big"), seek = $("seek"), time = $("time");
    const keep = (name, value) => { const url = new URL(location.href); url.searchParams.set(name, value); history.replaceState(null, "", url); };

    // The songs: one page each (?track=), so a switch is a fresh page; the camera and the
    // words go along in the address, and it plays on if the browser allows it. A song the
    // page has not got is the first it has (said before the player reads the address).
    const songs = JSON.parse(body.dataset.songs);
    let here = params.get("track") || body.dataset.track;
    if (!songs.some((s) => s.slug === here)) {
      here = body.dataset.track;
      const url = new URL(location.href); url.searchParams.delete("track"); history.replaceState(null, "", url);
    }
    for (const song of songs) {
      const b = document.createElement("button");
      b.textContent = song.title;
      b.classList.toggle("on", song.slug === here);
      if (song.slug === here) b.setAttribute("aria-current", "true");
      b.addEventListener("click", () => {
        if (song.slug === here) return;
        const url = new URL(location.href);
        url.searchParams.set("track", song.slug);
        url.searchParams.delete("t");
        url.searchParams.set("play", "1");
        location.assign(url);

    if (now) { $("title").textContent = now.title; document.title = `${now.title} · song`; }

    // What it is opened on. From a telephone's home screen there is no browser round it.
    // ?full=1: a link to the picture with nothing over it; the first touch, which starts it
    // with its sound, also asks the browser for its own full screen, where it has one.
    const home = navigator.standalone === true || matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches;
    const alone = Boolean(params.get("full")) || home;
    const handheld = matchMedia("(hover: none) and (pointer: coarse)").matches;
    const phone = handheld && Math.min(screen.width, screen.height) < 600;
    const own = Boolean(document.fullscreenEnabled && stage.requestFullscreen);
    // A telephone draws as many pixels as it was seen to keep up with, and fewer if it
    // cannot (the player's ?maxpixels, ?maxheight, ?adapt).
    body.dataset.adapt = "1";
    if (phone) body.dataset.maxpixels = "900000";
    else if (handheld) body.dataset.maxheight = "1080";
    else body.dataset.maxpixels = String(2560 * 1440);        // (a window wider than 16:9 is not more to draw)

    // takes it away or brings it back, and two touches stop the song or start it. A mouse:
    // a click stops and starts, as on any video; it is there while the mouse moves, and
    // goes when it has been still for three seconds of the song.
    let touch = handheld, tapped = 0, hiding = 0, resting = 0, strip = null;
    const shown = () => !body.classList.contains("clear");
    const clear = (on) => {
      body.classList.toggle("clear", on);
      clearTimeout(resting);                                // what was heard is not drawn where it is not seen
      if (!on && strip) strip.rest(false);
      if (on) resting = setTimeout(() => { if (strip && !shown()) strip.rest(true); }, 600);
    };
    const later = (after = 3000) => {
      clearTimeout(hiding);
      hiding = setTimeout(() => {
        if (!audio.paused && !stage.querySelector("#over :hover, #over :focus-visible")) clear(true);
      }, after);
    };
    const show = () => { clear(false); clearTimeout(hiding); if (!touch && !audio.paused) later(); };
    if (alone) clear(true);

    const blip = $("blip");
    const sign = (playing) => {
      blip.classList.remove("shown");
      blip.classList.toggle("play", playing);
      void blip.offsetWidth;                                // so that it begins again
      blip.classList.add("shown");
    };
    const toggle = () => {
      if (body.classList.contains("played")) sign(audio.paused);
      else if (alone && own && !document.fullscreenElement) stage.requestFullscreen().catch(() => {});
      $("play").click();
    };
    stage.addEventListener("pointerdown", (e) => { touch = e.pointerType !== "mouse"; }, true);
    stage.addEventListener("pointermove", (e) => { if (e.pointerType === "mouse") { touch = false; show(); } });
    stage.addEventListener("focusin", (e) => { if (e.target.closest("#over")) show(); });
    big.addEventListener("click", toggle);
    gl.addEventListener("click", () => {
      clearTimeout(hiding);
      if (!touch || !body.classList.contains("played")) { toggle(); return; }
      const at = performance.now(), twice = at - tapped < 320;
      tapped = twice ? 0 : at;
      clear(shown());                                       // (the second of two touches puts it back as it was)
      if (twice) toggle();
    });
    audio.addEventListener("play", () => {
      const first = !body.classList.contains("played");
      body.classList.add("played", "playing");
      if (!touch || first) later();                         // the first time, a finger's too: the picture has the screen
    });
    audio.addEventListener("pause", () => { body.classList.remove("playing"); show(); });

    // what was heard: drawn from when there is a player, faded when turned off
    const heard = $("heard"), bare = Boolean(params.get("bare") || params.get("embed"));
    let hearing = params.get("heard") !== "off";
    const hear = async () => {
      heard.classList.toggle("off", !hearing);
      $("hears").setAttribute("aria-pressed", String(hearing));
      if (hearing && !strip && !bare && window.player) {
        strip = (await import("./heard.js")).strip(heard, window.player);
        strip.rest(!shown());
      }
      if (!hearing && strip) { const was = strip; strip = null; setTimeout(() => { if (!hearing) was.stop(); else strip = was; }, 700); }
    };
    $("hears").addEventListener("click", () => { hearing = !hearing; keep("heard", hearing ? "on" : "off"); hear(); });
    hear();

    // The words keep clear of what is over the picture. A line is set where the picture has
    // room for it; while the bar or the controls are over that place, it is moved to just
    // clear of them, and back when they go. Two lines moved are kept apart.
    const moved = new Map();                                // a line -> how far it is moved, in pixels
    function lifted() {
      const layer = $("lyrics");
      if (!layer || (!moved.size && !shown())) return;
      const lines = [...layer.children].filter((l) => Number(l.style.opacity) > 0 || moved.has(l));
      if (!lines.length) return;
      const box = layer.getBoundingClientRect();
      let head = -Infinity, foot = Infinity;
      if (shown()) {
        const gap = Math.max(8, 0.015 * box.height);
        const tops = [...$("foot").children].filter((c) => c.offsetParent && !c.classList.contains("off"));
        if (tops.length) foot = tops[0].getBoundingClientRect().top - gap;
        head = Math.max(...[...$("top").children].map((c) => c.getBoundingClientRect().bottom)) + gap;
      }
      const at = lines.map((l) => {
        const mid = box.top + box.height * parseFloat(l.style.top) / 100, h = l.offsetHeight;
        return { l, top: mid - h / 2, bottom: mid + h / 2, by: 0, on: Number(l.style.opacity) > 0 };
      });
      for (const a of at.filter((a) => a.on).sort((a, b) => b.bottom - a.bottom)) {      // from the lowest, up
        if (a.bottom > foot) a.by = foot - a.bottom;
        foot = Math.min(foot, a.top + a.by - 4);
      }
      for (const a of at.filter((a) => a.on).sort((a, b) => a.top - b.top)) {            // from the highest, down
        if (a.top + a.by < head) a.by = head - a.top;
        head = Math.max(head, a.bottom + a.by + 4);
      }
      for (const a of at) {
        const by = Math.round(a.by), was = moved.get(a.l);
        if (!a.on && was === undefined) continue;
        if (by === (was || 0)) { if (!a.on && !by) moved.delete(a.l); continue; }
        // a line not yet seen is set there at once; one that is seen goes there, eased
        a.l.style.transition = was === undefined && getComputedStyle(a.l).opacity < 0.2 ? "none" : "";
        a.l.style.translate = by ? `0 ${by}px` : "";
        if (by || a.on) moved.set(a.l, by); else moved.delete(a.l);
      }
    }

    const clock = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
    function ready(player) {
      // the cameras: the light slides to the one taken, as the picture moves to it
      const cams = $("cams"), names = player.variants("camera");
      const taken = () => {
        cams.style.setProperty("--n", names.length);
        cams.style.setProperty("--i", Math.max(names.indexOf(player.chosen.camera), 0));
        for (const b of cams.children) {
          b.classList.toggle("on", b.dataset.name === player.chosen.camera);
          b.setAttribute("aria-pressed", String(b.dataset.name === player.chosen.camera));
        }
      };
      for (const name of names) {
        const b = document.createElement("button");
        b.textContent = name.charAt(0).toUpperCase() + name.slice(1);
        b.dataset.name = name;
        b.addEventListener("click", () => { player.choose("camera", name, 1.2); taken(); });
        cams.appendChild(b);
      }
      if (names.length) taken(); else cams.hidden = true;

      // the words, where the song has them
      const words = $("words");
      const worded = () => words.setAttribute("aria-pressed", String(player.lyrics === true));
      if (player.lyrics === null) { words.disabled = true; words.title = "This song has no lyrics"; }
      words.addEventListener("click", () => { player.setLyrics(!player.lyrics); worded(); });
      worded();

      // the time, and how far along the line the song has come
      let said = "", copied = 0;
      const total = clock(player.duration);
      const tick = () => {
        requestAnimationFrame(tick);
        lifted();
        if (!shown()) return;
        const t = player.time();
        seek.style.setProperty("--p", `${(100 * Number(seek.value) / player.duration).toFixed(2)}%`);
        const say = clock(t);
        if (say === said || performance.now() < copied) return;
        said = say;
        time.innerHTML = `<b>${say}</b> / ${total}`;
        seek.setAttribute("aria-valuetext", `${say} of ${total}`);
      };
      requestAnimationFrame(tick);
      time.addEventListener("click", () => {
        const url = new URL(location.href); url.searchParams.set("t", audio.currentTime.toFixed(1));
        history.replaceState(null, "", url);
        if (navigator.clipboard) navigator.clipboard.writeText(url.href).then(() => {
          time.textContent = "Link copied"; said = ""; copied = performance.now() + 1400;
        }, () => {});
      });

      hear();
    }

    // The window, asked every frame: a telephone does not always say when it has been
    // turned, or says so before its window has its new size. The stage is as large as it
    // is, and the frame's shape is the window's: tall in one held upright (unless the
    // address says which, ?shape=).
    const follows = !["tall", "wide"].includes(params.get("shape"));
    const near = (a, b) => Math.abs(a - b) <= 0.15 * b;
    let measured = "";
    function sized() {
      let W = innerWidth, H = innerHeight;
      // From the home screen the page has the whole screen, and its window is said short of
      // it (by the clock's bar): the screen's own size is what is true there.
      if (home && handheld && !document.fullscreenElement) {
        const long = Math.max(screen.width, screen.height), short = Math.min(screen.width, screen.height);
        const [w, h] = W > H ? [long, short] : [short, long];
        if (near(W, w) && near(H, h)) [W, H] = [w, h];
      }
      if (!W || !H) return;
      if (follows && window.player) window.player.setShape(W > H ? "wide" : "tall");
      if (`${W} ${H}` === measured) return;
      measured = `${W} ${H}`;
      body.style.setProperty("--fw", `${W}px`);
      body.style.setProperty("--fh", `${H}px`);
    }
    (function watch() { sized(); requestAnimationFrame(watch); })();

    // Full screen: the browser's own, where it has one for more than a video (a telephone's
    // Safari has not: there the page is as much of the screen as a page can be).
    const full = $("full");
    full.hidden = !own;
    full.addEventListener("click", () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else stage.requestFullscreen().catch(() => {});
    });
    addEventListener("keydown", (e) => {
      if (!touch) show();
      if (e.key === "f" && !e.metaKey && !e.ctrlKey && own) full.click();
    });

    // what went wrong, said plainly, over the picture (what the player says of it is for its maker)
    const error = $("error");
    new MutationObserver(() => {
      if (error.hidden || body.classList.contains("failed")) return;
      body.classList.add("failed");
      console.error(error.textContent);
      error.textContent = /WebGL2/.test(error.textContent)
        ? "This browser cannot draw the video. A recent Safari, Chrome or Firefox can."
        : "The video could not be loaded. Reload the page to try again.";
      clear(false);
    }).observe(error, { attributes: true, attributeFilter: ["hidden"] });

    if (params.get("measure")) {
      const box = $("measure"), probe = document.createElement("div");
      probe.style.cssText = "position:fixed;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)";
      body.appendChild(probe);
      box.hidden = false;
      const px = (v) => Math.round(parseFloat(v));
      setInterval(() => {
        const s = stage.getBoundingClientRect(), safe = getComputedStyle(probe), v = window.visualViewport, words = $("lyrics");
        const f = words ? words.getBoundingClientRect() : s;
        box.textContent = [
          `window  ${innerWidth} x ${innerHeight}`,
          `root    ${document.documentElement.clientWidth} x ${document.documentElement.clientHeight}`,
          v ? `visual  ${Math.round(v.width)} x ${Math.round(v.height)}  at ${Math.round(v.offsetLeft)},${Math.round(v.offsetTop)}  x${v.scale.toFixed(2)}` : "visual  none",
          `screen  ${screen.width} x ${screen.height}  x${devicePixelRatio}  ${screen.orientation ? screen.orientation.type : window.orientation}`,
          `safe    ${px(safe.paddingTop)} ${px(safe.paddingRight)} ${px(safe.paddingBottom)} ${px(safe.paddingLeft)}`,
          `home ${home ? "yes" : "no"}  finger ${handheld ? "yes" : "no"}  phone ${phone ? "yes" : "no"}  full ${document.fullscreenElement ? "yes" : own ? "no" : "none"}`,
          `stage   ${Math.round(s.width)} x ${Math.round(s.height)}  at ${Math.round(s.left)},${Math.round(s.top)}`,
          `frame   ${Math.round(f.width)} x ${Math.round(f.height)}  ${window.player ? window.player.shape : ""}`,
          `drawn   ${gl.width} x ${gl.height}  ${(gl.width * gl.height / 1e6).toFixed(2)} MP`,
          `rate    ${audio.paused ? "paused" : $("fps").textContent}`,
        ].join("\n");
      }, 500);
    }

    // the big button is only offered once the picture can play
    new MutationObserver((_, watch) => {
      if (!body.classList.contains("ready") || !window.player) return;
      watch.disconnect();
      big.disabled = false;
      ready(window.player);
    }).observe(body, { attributes: true, attributeFilter: ["class"] });
  </script>
  <script type="module" src="player.js"></script>
</body>
</html>
