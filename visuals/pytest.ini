[pytest]
testpaths = tests
pythonpath = ..
addopts = -q
# CI runs `-m "not local"`: the tests that need only numpy, scipy, soundfile, moderngl's
# import and node. `local` is for the rest - a GL context, the example song, its
# listening cache - which skip or fail anywhere but a machine that has made the video.
markers =
    local: needs a GL context, the example song or its listening cache
