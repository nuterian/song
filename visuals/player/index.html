<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>visuals</title>
<link rel="preload" href="fonts/Inter-Light.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* the words' face: one font for the page, the studio and the mp4 (fonts/OFL.txt) */
  @font-face {
    font-family: "Inter"; font-style: normal; font-weight: 300; font-display: block;
    src: url("fonts/Inter-Light.woff2") format("woff2");
  }
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #08080a; color: #b9b9c4;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  body { display: grid; grid-template-rows: 1fr auto; }
  #stage { display: grid; place-items: center; min-height: 0; padding: 16px; }
  canvas {
    width: 100%; max-width: 1280px; aspect-ratio: 16 / 9; height: auto;
    background: #000; border-radius: 2px; display: block;
  }
  #bar {
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    padding: 10px 16px; border-top: 1px solid #1c1c22;
  }
  button {
    font: inherit; color: #e7e7ef; background: #1c1c24; border: 1px solid #2c2c36;
    border-radius: 2px; padding: 5px 14px; cursor: pointer;
  }
  button:hover { background: #262630; }
  #seek { flex: 1 1 220px; min-width: 160px; accent-color: #8a7ad0; }
  #clock { color: #f2f0ff; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 15ch; cursor: pointer; }
  #readout { color: #7c7c8a; white-space: nowrap; }
  #fps { color: #5c5c6a; white-space: nowrap; min-width: 9ch; text-align: right; }
  .choice { display: flex; gap: 0; align-items: center; }
  .choice span { color: #5c5c6a; margin-right: 8px; }
  .choice button { border-radius: 0; margin-left: -1px; padding: 5px 12px; color: #9a9aa8; }
  .choice button:first-of-type { border-radius: 2px 0 0 2px; }
  .choice button:last-of-type { border-radius: 0 2px 2px 0; }
  .choice button.on { background: #3a3358; border-color: #5b4f8c; color: #f2f0ff; position: relative; }
  #error { padding: 16px; color: #e08a8a; white-space: pre-wrap; }
  /* the lyrics: warm off-white, light, small, letter-spaced; the ink is each word's own */
  #frame { position: relative; width: 100%; max-width: 1280px; aspect-ratio: 16 / 9; }
  #frame canvas { width: 100%; height: 100%; max-width: none; }
  #lyrics { position: absolute; inset: 0; pointer-events: none; overflow: hidden; container-type: size; transition: opacity .6s ease; }
  #lyrics .line {
    position: absolute; white-space: nowrap; opacity: 0;
    font-size: calc(var(--size) * 100cqh);
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 300;
    letter-spacing: 0.06em; color: rgb(238, 233, 222);
    text-shadow: 0 0 0.35em rgba(0, 0, 0, 0.55);
  }
  #lyrics .line span { opacity: 0.42; }
  /* embedded in the studio: the picture alone, as large as the frame allows; the studio has the controls */
  body.embed { grid-template-rows: 1fr; background: #000; }
  body.embed #bar { display: none; }
  body.embed #stage { padding: 0; height: 100vh; }
  body.embed canvas, body.embed #frame { width: min(100vw, calc(100vh * 16 / 9)); max-width: none; border-radius: 0; }
  body.embed #frame canvas { width: 100%; }
  /* the tall frame, 9:16: as high as there is room for */
  body.tall canvas, body.tall #frame { aspect-ratio: 9 / 16; max-width: min(1280px, calc((100vh - 120px) * 9 / 16)); }
  body.tall #frame canvas { max-width: none; }
  body.embed.tall canvas, body.embed.tall #frame { width: min(100vw, calc(100vh * 9 / 16)); max-width: none; }
  body.embed.tall #frame canvas { width: 100%; }
</style>
</head>
<body>
  <div id="stage"><canvas id="gl" width="1280" height="720"></canvas></div>
  <div id="bar">
    <button id="play">play</button>
    <span id="clock" title="click to copy a link to this moment">0:00.0</span>
    <input id="seek" type="range" min="0" max="1" step="0.001" value="0">
    <span id="choices"></span>
    <span id="readout">loading</span>
    <span id="fps"></span>
  </div>
  <div id="error" hidden></div>
  <audio id="audio" preload="auto"></audio>
  <script type="module" src="player.js"></script>
</body>
</html>
