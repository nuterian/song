<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio</title>
<style>
  @font-face {
    font-family: "Inter"; font-style: normal; font-weight: 300; font-display: block;
    src: url("/player/fonts/Inter-Light.woff2") format("woff2");
  }
  :root {
    color-scheme: dark;
    --bg: #0e0e10; --panel: #151518; --raise: #1c1c20; --line: #242429; --line2: #303037;
    --text: #d8d8dd; --muted: #85858f; --faint: #55555e;
    --accent: #f0a54a; --head: #ff5a4f; --ok: #7fcf9a; --bad: #f08a80;
    --clip: #2f3b51; --clip-edge: #465877; --clip-text: #cdd6e8;
    --climax: #5e4819; --climax-edge: #c19438; --climax-text: #f6dea0;
    --moment: #e4804a; --word: #cfc8b8;
    --drive: #8b8996; --float: #54536a; --void: #2e2d36;
    --tl: 206px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body { display: grid; grid-template-rows: 44px minmax(0, 1fr) 5px var(--tl); }
  button, select, input { font: inherit; color: inherit; }
  .ic { display: block; flex: none; }
  .ib { display: inline-grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 6px;
        background: transparent; color: var(--muted); cursor: pointer; }
  .ib:hover:not(:disabled) { background: var(--raise); color: var(--text); }
  .ib:disabled { color: var(--faint); opacity: 0.5; cursor: default; }
  .ib.on { color: var(--accent); }
  select { background: transparent; border: 0; color: var(--text); font-weight: 500; font-size: 13px; padding: 4px; border-radius: 6px; }
  select:hover { background: var(--raise); }
  input[type=range] { accent-color: var(--accent); width: 100%; margin: 0; height: 18px; }
  [hidden] { display: none !important; }

  /* the top bar */
  #top { display: flex; align-items: center; gap: 10px; padding: 0 10px 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #facts { color: var(--faint); white-space: nowrap; }
  #askwrap { flex: 1; display: flex; justify-content: center; position: relative; }
  #askbox { display: flex; align-items: center; gap: 6px; width: min(560px, 100%); height: 30px; padding: 0 4px 0 10px;
            background: var(--bg); border: 1px solid var(--line2); border-radius: 15px; color: var(--muted); }
  #askbox:focus-within { border-color: var(--accent); color: var(--accent); }
  #ask { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--text); }
  #ask::placeholder { color: var(--faint); }
  #model { font-size: 11px; font-weight: 400; color: var(--faint); max-width: 11ch; }
  #askbox.thinking .ic { animation: pulse 1.1s ease-in-out infinite; color: var(--accent); }
  @keyframes pulse { 50% { opacity: 0.25; } }
  #status { color: var(--faint); white-space: nowrap; min-width: 9ch; max-width: 36ch; overflow: hidden; text-overflow: ellipsis;
            text-align: right; font-variant-numeric: tabular-nums; }
  #status.busy { color: var(--accent); }
  #status.bad { color: var(--bad); }

  /* a proposal, under the ask box */
  .pop { position: absolute; top: 38px; width: min(560px, 100%); z-index: 20; background: var(--raise); border: 1px solid var(--line2);
         border-radius: 10px; padding: 10px 12px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5); }
  .pop .said { color: var(--muted); margin-bottom: 6px; }
  .pop ul { margin: 0 0 8px; padding: 0; list-style: none; }
  .pop li { display: flex; gap: 6px; align-items: center; padding: 2px 0; }
  .pop li .ic { color: var(--accent); }
  .pop .acts { display: flex; gap: 6px; justify-content: flex-end; }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--line2);
          background: transparent; cursor: pointer; }
  .pill:hover { background: var(--line); }
  .pill.go { border-color: var(--accent); color: var(--accent); }
  .pop.bad { border-color: var(--bad); }
  .pop.bad li .ic { color: var(--bad); }

  /* the work area: viewer and inspector */
  #work { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; }
  #viewer { display: grid; grid-template-rows: minmax(0, 1fr) 38px; min-width: 0; min-height: 0; background: #000; }
  #player { width: 100%; height: 100%; border: 0; display: block; background: #000; }
  #transport { display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--panel); border-top: 1px solid var(--line); }
  #clock { font-variant-numeric: tabular-nums; color: var(--text); min-width: 11ch; }
  #clock .of { color: var(--faint); }
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 7px; overflow: hidden; margin-left: auto; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 4px 10px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line2); }
  .seg button.on { background: var(--line2); color: var(--text); }
  .seg + .seg { margin-left: 0; }
  #shapes button { padding: 3px 8px; display: grid; place-items: center; }

  #side { display: grid; grid-template-columns: minmax(0, 1fr) 40px; border-left: 1px solid var(--line); background: var(--panel); min-height: 0; }
  #pane { overflow-y: auto; overflow-x: hidden; padding: 14px 14px 20px; min-height: 0; min-width: 0; }
  #tabs { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px; border-left: 1px solid var(--line); }
  #tabs .ib.on { background: var(--raise); }
  .h { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 13px; margin-bottom: 12px; }
  .h .ic { color: var(--muted); }
  .sub { color: var(--faint); font-weight: 400; margin-left: auto; font-variant-numeric: tabular-nums; }
  .empty { height: 100%; display: grid; place-items: center; align-content: center; gap: 8px; color: var(--faint); text-align: center; }
  .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
  .tile { display: grid; justify-items: center; gap: 4px; padding: 10px 4px 8px; border-radius: 8px; border: 1px solid var(--line);
          background: transparent; color: var(--muted); cursor: pointer; }
  .tile:hover { background: var(--raise); color: var(--text); }
  .tile.on { border-color: var(--accent); color: var(--text); background: var(--raise); }
  .tile.on .ic { color: var(--accent); }
  .planets { display: flex; gap: 6px; flex-wrap: wrap; }
  .dot { width: 22px; height: 22px; border-radius: 50%; border: 0; cursor: pointer; box-shadow: 0 0 0 2px var(--panel); }
  .dot.on { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--accent); }
  .dim { opacity: 0.35; pointer-events: none; }
  .row { display: flex; align-items: center; gap: 8px; }
  .dial { margin-bottom: 14px; }
  .dial .top { display: flex; justify-content: space-between; margin-bottom: 3px; color: var(--muted); }
  .dial .top b { font-weight: 400; color: var(--text); font-variant-numeric: tabular-nums; }
  .dial.moved .top span:first-child::after { content: " •"; color: var(--accent); }
  .part { margin-bottom: 12px; }
  .part .name { color: var(--muted); margin-bottom: 4px; cursor: help; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { border: 1px solid var(--line2); background: transparent; color: var(--muted); border-radius: 12px; padding: 3px 9px; cursor: pointer; }
  .chip:hover { color: var(--text); }
  .chip.on { border-color: var(--accent); color: var(--text); }
  .preview { font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 300; letter-spacing: 0.06em; color: rgb(238, 233, 222);
             background: #05060a; border-radius: 8px; padding: 14px; text-align: center; margin-bottom: 14px; white-space: nowrap; overflow: hidden; }
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border-radius: 6px; color: var(--muted); cursor: pointer; }
  .log li .ic { margin-top: 1px; }
  .log li:hover { background: var(--raise); }
  .log li.now { color: var(--text); background: var(--raise); }
  .log li.now .ic { color: var(--accent); }
  .log li.ahead { color: var(--faint); }
  .quote { font-size: 13px; line-height: 1.5; margin-bottom: 8px; }
  .muted { color: var(--faint); }

  /* the split between work and timeline */
  #split { cursor: ns-resize; background: var(--bg); border-top: 1px solid var(--line); }
  #split:hover { background: var(--line); }

  /* the timeline */
  #timeline { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr); min-height: 0; background: var(--panel); }
  #labels { border-right: 1px solid var(--line); padding-top: 22px; }
  #labels > div { height: 30px; display: grid; place-items: center; color: var(--faint); position: relative; }
  #labels > div.energy { height: 40px; }
  #labels > div.words { height: 22px; }
  #labels .add { position: absolute; right: -2px; bottom: 1px; width: 16px; height: 16px; border-radius: 4px; }
  #scroll { overflow-x: auto; overflow-y: auto; min-height: 0; position: relative; }
  #tracks { position: relative; min-width: 100%; user-select: none; padding-bottom: 8px; overflow: hidden; }
  #ruler { height: 22px; position: relative; border-bottom: 1px solid var(--line); cursor: pointer; }
  .tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line2); padding: 5px 0 0 4px; font-size: 10.5px; color: var(--faint);
          white-space: nowrap; font-variant-numeric: tabular-nums; }
  .lane { position: relative; height: 30px; border-bottom: 1px solid var(--line); }
  .lane.energy { height: 40px; }
  .lane.words { height: 22px; }
  .blk { position: absolute; top: 4px; bottom: 4px; border-radius: 3px; padding: 0 6px; font-size: 11px; overflow: hidden;
         white-space: nowrap; display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .sec { color: var(--muted); border-left: 1px solid var(--line2); border-radius: 0; top: 0; bottom: 0; padding-left: 6px; }
  .sec:hover, .sec.sel { color: var(--text); background: rgba(255, 255, 255, 0.04); }
  .act { background: var(--clip); border-top: 1px solid var(--clip-edge); color: var(--clip-text); }
  .act .ic { opacity: 0.8; }
  .act.climax { background: var(--climax); border-top-color: var(--climax-edge); color: var(--climax-text); }
  .act.sel { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .act.changed, .mk.changed { box-shadow: inset 0 0 0 1.5px var(--accent); background-image: repeating-linear-gradient(135deg, rgba(240,165,74,0.18) 0 6px, transparent 6px 12px); }
  .proposed .act:not(.changed) { opacity: 0.4; }
  .edge { position: absolute; top: 0; bottom: 0; width: 10px; margin-left: -5px; cursor: ew-resize; z-index: 2; }
  .edge:hover::after, .edge.drag::after { content: ""; position: absolute; left: 4px; top: 3px; bottom: 3px; width: 2px; background: var(--accent); border-radius: 1px; }
  .edge .tip { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10.5px; color: var(--accent); white-space: nowrap; }
  .mk { position: absolute; bottom: 4px; width: 6px; margin-left: -3px; background: var(--moment); border-radius: 2px; cursor: grab; }
  .mk.sel { box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 3px var(--accent); }
  .mk.gone { background: transparent; box-shadow: inset 0 0 0 1.5px var(--moment); }
  .line { position: absolute; top: 7px; bottom: 7px; background: var(--word); opacity: 0.45; border-radius: 2px; cursor: pointer; }
  .line:hover, .line.sel { opacity: 0.95; }
  canvas.env { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  #playhead { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--head); pointer-events: none; z-index: 5; }
  #playhead::before { content: ""; position: absolute; top: 0; left: -5px; border: 5px solid transparent; border-top: 7px solid var(--head); }
  #selband { position: absolute; top: 22px; bottom: 0; background: rgba(240, 165, 74, 0.10); box-shadow: inset 1px 0 var(--accent), inset -1px 0 var(--accent);
             pointer-events: none; z-index: 1; }
  .sedge { position: absolute; top: 0; bottom: 0; width: 8px; margin-left: -4px; cursor: ew-resize; z-index: 2; }
  .sedge:hover::after, .sedge.drag::after { content: ""; position: absolute; left: 3px; top: 4px; bottom: 4px; width: 2px; background: var(--accent); border-radius: 1px; }
  .sedge .tip { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10.5px; color: var(--accent); white-space: nowrap; }
  .sec.sel { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .bt { position: absolute; bottom: 0; height: 5px; border-left: 1px solid var(--line2); }
  .field { display: flex; gap: 6px; margin-bottom: 8px; }
  .field input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 8px; color: var(--text); outline: none; }
  .field input:focus { border-color: var(--accent); }
  .label { color: var(--faint); margin: 12px 0 6px; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper .v { min-width: 9ch; text-align: center; font-variant-numeric: tabular-nums; }
  .muted.small { font-size: 11px; margin-top: 12px; }
  #click.on { color: var(--accent); }
  #hoverband { position: absolute; top: 22px; bottom: 0; background: rgba(240, 165, 74, 0.16); pointer-events: none; z-index: 4;
               box-shadow: inset 1px 0 var(--accent), inset -1px 0 var(--accent); }
  .hist { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; position: relative; min-width: 0; }
  .card:hover { background: var(--raise); }
  .card.now { border-color: var(--accent); background: var(--raise); }
  .card.ahead { opacity: 0.45; }
  .card .who { display: flex; align-items: center; gap: 6px; color: var(--muted); margin-bottom: 4px; min-width: 0; }
  .card .who q { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .card .who q::before, .card .who q::after { color: var(--faint); }
  .card .when { margin-left: auto; color: var(--faint); font-variant-numeric: tabular-nums; flex: none; }
  .card.now .who .ic { color: var(--accent); }
  .chg { display: flex; align-items: center; gap: 6px; padding: 3px 0; min-width: 0; color: var(--text); }
  .chg > .ic { color: var(--muted); }
  .chg .t { color: var(--muted); flex: none; }
  .chg .was { color: var(--faint); text-decoration: line-through; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .chg .now { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .chg .where { margin-left: auto; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; flex: none; }
  .pop .said { display: flex; gap: 6px; align-items: flex-start; }
  .pop .said .ic { color: var(--accent); margin-top: 1px; }
  .pop .rows { margin-bottom: 10px; }
  #zoom { position: absolute; right: 6px; bottom: 6px; display: flex; gap: 2px; background: var(--raise); border-radius: 8px; z-index: 6; }
  .anchor { position: relative; }
  #exportpop { top: auto; bottom: 38px; right: 0; width: 420px; }
  #exportpop .kinds { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  #exportpop .kinds .seg { margin-left: 0; }
  #status .of { color: var(--faint); margin-left: 6px; }
  #exportpop .path { font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); word-break: break-all; margin: 2px 0 10px; }
  #status a { display: inline-flex; align-items: center; gap: 5px; color: var(--accent); text-decoration: none; }
  #status a:hover { text-decoration: underline; }
  #toast { position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%); z-index: 30; max-width: 70%; }

  /* adding a song: a file dropped anywhere on the page */
  body.dropping #player { pointer-events: none; }
  body.dropping::after { content: "Drop to add the song"; position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
                         font-size: 14px; color: var(--accent); background: rgba(240, 165, 74, 0.06);
                         box-shadow: inset 0 0 0 2px var(--accent); pointer-events: none; }
</style>
</head>
<body>
  <header id="top">
    <select id="songs" aria-label="Song"></select>
    <span id="facts"></span>
    <div id="askwrap">
      <label id="askbox" title="Ask for a change, in words: a local model makes it">
        <span id="askicon"></span>
        <input id="ask" type="text" placeholder="Ask for a change" autocomplete="off" spellcheck="false">
        <select id="model" aria-label="Model" title="The local model that answers: gpt-oss is the most accurate; a smaller one is quicker when memory is short"></select>
        <button class="ib" id="askbtn" aria-label="Ask"></button>
      </label>
      <div id="proposal" class="pop" hidden></div>
    </div>
    <span id="status"></span>
    <button class="ib" id="undo" aria-label="Undo" title="Undo  ⌘Z"></button>
    <button class="ib" id="redo" aria-label="Redo" title="Redo  ⇧⌘Z"></button>
  </header>

  <div id="work">
    <section id="viewer">
      <iframe id="player" title="The video"></iframe>
      <div id="transport">
        <button class="ib" id="play" aria-label="Play" title="Play  space"></button>
        <span id="clock">0:00.0</span>
        <span class="seg" id="cams" title="Camera"></span>
        <span class="seg" id="shapes" role="group" aria-label="Frame"></span>
        <button class="ib" id="click" aria-label="Click track" title="A click on every beat: hear whether the grid is right"></button>
        <button class="ib" id="lyr" aria-label="Words on or off" title="Words on the picture"></button>
        <span class="anchor">
          <button class="ib" id="export" aria-label="Export an mp4" title="Export an mp4 of the whole song, as it is shown"></button>
          <div id="exportpop" class="pop" hidden></div>
        </span>
      </div>
      <div id="toast" hidden></div>
    </section>
    <aside id="side">
      <div id="pane"></div>
      <nav id="tabs"></nav>
    </aside>
  </div>

  <div id="split" title="Drag to resize"></div>

  <section id="timeline">
    <div id="labels">
      <div title="Sections"></div>
      <div class="energy" title="Energy: bright when the kick is in, dim when it floats, dark when empty"></div>
      <div title="Shots: what the camera does"></div>
      <div title="Moments: the beat comes back. Taller is harder."><button class="ib add" id="addmoment" aria-label="Add a moment at the playhead" title="Add a moment at the playhead"></button></div>
      <div class="words" title="Words"></div>
    </div>
    <div id="scroll">
      <div id="tracks">
        <div id="ruler"></div>
        <div class="lane" id="lane-song"></div>
        <div class="lane energy" id="lane-energy"><canvas class="env" id="env"></canvas></div>
        <div class="lane" id="lane-shots"></div>
        <div class="lane" id="lane-moments"></div>
        <div class="lane words" id="lane-words"></div>
        <div id="selband" hidden></div>
        <div id="hoverband" hidden></div>
        <div id="playhead"></div>
      </div>
    </div>
    <div id="zoom"></div>
  </section>
  <input type="file" id="pickaudio" multiple hidden>
  <input type="file" id="picklyrics" accept=".txt,text/plain" hidden>
  <script type="module" src="studio.js"></script>
</body>
</html>
